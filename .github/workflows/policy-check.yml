name: Policy Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    uses: hamanpaul/paulsha-conventions/.github/workflows/reusable-policy-check.yml@4ff59b6c35a46a87af3c3e641975743ee8fa0858
    with:
      policy_profile: flat
      policy_version: "1.0.1"
      policy_engine_ref: 4ff59b6c35a46a87af3c3e641975743ee8fa0858

  policy-check:
    name: policy-check
    runs-on: ubuntu-latest
    needs: policy
    if: always()
    steps:
      - name: Mirror reusable policy result
        run: |
          if [ "${{ needs.policy.result }}" != "success" ]; then
            echo "Reusable policy workflow result: ${{ needs.policy.result }}"
            exit 1
          fi
          echo "Reusable policy workflow passed."
